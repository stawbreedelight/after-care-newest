<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Import Date Ideas</title>
</head>

<body>

  <h1>Import Date Ideas</h1>

  <input
    type="file"
    id="jsonFile"
    accept=".json"
  >

  <button id="importButton">
    Import into Firebase
  </button>

  <p id="status"></p>


  <script type="module">

    import { db } from "./firebase-config.js";

    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const fileInput =
      document.getElementById("jsonFile");

    const importButton =
      document.getElementById("importButton");

    const status =
      document.getElementById("status");


    importButton.addEventListener(
      "click",
      async () => {

        const file =
          fileInput.files[0];

        if (!file) {
          alert("Choose your JSON file first.");
          return;
        }

        try {

          const text =
            await file.text();

          const dateIdeas =
            JSON.parse(text);

          status.textContent =
            "Importing...";


          for (const idea of dateIdeas) {

            const {
              documentId,
              ...data
            } = idea;

            if (!documentId) {
              console.warn(
                "Skipped idea with no documentId:",
                idea
              );

              continue;
            }

            await setDoc(
              doc(
                db,
                "dateIdeas",
                documentId
              ),
              data
            );
          }


          status.textContent =
            `Done! Imported ${dateIdeas.length} date ideas.`;

        } catch (error) {

          console.error(error);

          status.textContent =
            "Import failed.";

          alert(
            error.message
          );
        }
      }
    );

  </script>

</body>

</html>

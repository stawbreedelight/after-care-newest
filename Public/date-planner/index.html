<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mid Vanilla | Date Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section id="intro">

            <h1>Date Planner</h1>

            <p>
                Find a date you both actually want to do.
            </p>

            <button id="createButton">
                Create a Date
            </button>

            <button id="joinButton">
                Join a Date
            </button>

        </section>


        <section id="game" style="display: none;">

            <p id="roomCodeText"></p>

            <div id="dateCard">

                <h2 id="dateTitle">
                    Sunset Picnic
                </h2>

                <p id="dateDescription">
                    Pack some snacks and watch the sunset together.
                </p>

                <button id="yesButton">
                    Yes please 💕
                </button>

                <button id="noButton">
                    Not for me
                </button>

            </div>

        </section>


        <section id="results" style="display: none;">

            <h1>
                It’s a Date 💕
            </h1>

            <p>
                These are the ideas you both chose.
            </p>

            <div id="matchList"></div>

        </section>

    </main>


   <script type="module" src="app.js?v=8"></script>

</body>

</html>

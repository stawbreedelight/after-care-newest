<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Questions</title>
</head>

<body>

  <h1>Upload Pillow Talk Questions</h1>

  <button id="uploadButton">
    Upload Questions
  </button>

  <p id="status"></p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "mid-vanilla.firebaseapp.com",
      projectId: "mid-vanilla",
      storageBucket: "mid-vanilla.firebasestorage.app",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    const questions = [
      "What made you feel most connected to your partner tonight?",
      "What was your favorite moment together?",
      "What did your partner do that made you feel cared for?",
      "When did you feel most relaxed together?",
      "What made you smile tonight?",
      "What felt especially natural between you two?",
      "What is one thing you appreciated about your partner tonight?",
      "Did anything make you feel especially close to your partner?",
      "What did your partner do that you would love to experience again?",
      "What moment would you happily replay?",
      "What surprised you in a good way?",
      "Was there a moment that felt different from what you expected?",
      "What did you enjoy more than you expected?",
      "Did you discover anything new about yourself tonight?",
      "Did you discover anything new about your partner?",
      "What helped you feel comfortable and present?",
      "What made it easier to let go and enjoy the moment?",
      "What part of tonight felt most memorable?",
      "What did you feel most confident about tonight?",
      "What would you like your partner to know about how tonight felt?",
      "What made you feel most wanted?",
      "What made you feel most appreciated?",
      "Was there a moment when you felt especially in sync?",
      "What would you like more of next time?",
      "What would you happily do again?",
      "What would you like to slow down and enjoy more next time?",
      "Is there something you'd like your partner to initiate more often?",
      "Is there something you'd like to take the lead on next time?",
      "What kind of atmosphere would you love to create next time?",
      "What helped you feel comfortable communicating what you wanted?",
      "Is there something new you'd be curious to explore together?",
      "What would make your next experience feel even more connected?",
      "Was there a moment when you felt particularly desired?",
      "What is one thing you'd love your partner to remember from tonight?",
      "What would you like to make more time for as a couple?",
      "Did tonight change or deepen how you see your partner?",
      "What part of tonight made you feel most emotionally safe?",
      "Was there anything you wanted but didn't express?",
      "Is there anything you'd like to talk about while it's still fresh?",
      "What could your partner do next time to help you feel more comfortable?",
      "Was there a moment when you felt especially vulnerable in a good way?",
      "What did tonight teach you about what you enjoy?",
      "What did tonight teach you about what your partner enjoys?",
      "Is there something you'd like to communicate more openly in the future?",
      "What would you like to leave behind from tonight and carry forward?",
      "How did you feel about the way you communicated with each other?",
      "What made you feel most understood by your partner?",
      "What is one way you could make each other feel even more cared for next time?",
      "If you could add one thing to tonight, what would it be?",
      "What is one thing you'd love to do differently together next time?"
    ];


    document
      .getElementById("uploadButton")
      .addEventListener("click", async () => {

        const status = document.getElementById("status");

        status.textContent = "Uploading...";

        for (const question of questions) {

          await addDoc(
            collection(db, "questions"),
            {
              question: question
            }
          );

        }

        status.textContent = "Done! Questions uploaded.";

      });

  </script>

</body>
</html>

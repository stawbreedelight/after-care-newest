<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vanilla Land</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <section class="level-vanilla-screen">


            <!-- VANILLA LAND LOGO -->

            <img
                src="images/vanilla-land.PNG"
                alt="Vanilla Land"
                class="vanilla-land-icon"
            >


            <!-- VANILLA LAND INTRO -->

            <p>
                Welcome to Vanilla Land
                <br><br>

                Sweet, playful, and comfortably close. This is your space
                to slow down, enjoy each other, and build connection
                without any pressure to go further.
                <br><br>

                Choose something that feels good to both of you and see
                where the moment takes you.
            </p>


            <!-- GAMES -->

            <div class="level-games">


                <!-- PILLOW TALK -->

                <a href="pillow-talk.html" class="game-link">

                    <img
                        src="images/pillow-talk.PNG"
                        alt="Pillow Talk"
                        class="game-icon"
                    >

                </a>


                <!-- DATE PLANNER -->

                <a href="date-planner.html" class="game-link">

                    <img
                        src="images/date-planner.PNG"
                        alt="Date Planner"
                        class="date-planner-logo"
                    >

                </a>


                <!-- COMING SOON -->

                <button class="game-button" disabled>
                    Coming Soon
                </button>


            </div>

        </section>

    </main>

</body>

</html>

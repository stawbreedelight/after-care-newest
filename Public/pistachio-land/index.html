
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pistachio Land | Mid Vanilla</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body class="pistachio-land">

    <header class="pistachio-header">
        <a href="/flavours.html" class="back-button">
            ← Back to Flavours
        </a>
    </header>

    <main class="pistachio-container">

        <h1>Welcome to Pistachio Land</h1>

        <p class="pistachio-intro">
            Step into an enchanted world of
            pistachio forests, magical adventures
            and sweet surprises.
        </p>

        <div class="pistachio-image">
            🌿🍦💚
        </div>

        <h2>Choose Your Adventure</h2>

        <div class="pistachio-levels">

            <button class="level-button"
                    data-level="1">
                Level 1
            </button>

            <button class="level-button"
                    data-level="2">
                Level 2
            </button>

            <button class="level-button"
                    data-level="3">
                Level 3
            </button>

        </div>

        <section id="pistachio-game"
                 class="pistachio-game"
                 hidden>
            <h2 id="game-title"></h2>
            <p id="game-description"></p>

            <button id="close-game"
                    class="back-button">
                Back to Levels
            </button>
        </section>

    </main>

</body>
</html>
